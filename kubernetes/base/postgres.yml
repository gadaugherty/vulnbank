apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vulnbank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            # VULNERABILITY: Credentials in plain env vars (CWE-798)
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin123"
            - name: POSTGRES_DB
              value: "vulnbank"
          # VULNERABILITY: No resource limits
          # VULNERABILITY: No persistent volume — data loss on restart
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vulnbank
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
