apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: vulnbank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      # FIX: Security context at pod level
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: auth-api
          # FIX: Pinned image tag (use SHA in production)
          image: vulnbank/auth-api:1.0.0
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "vulnbank"
            # FIX: Secrets from Kubernetes Secret, not plain env vars
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vulnbank-db-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vulnbank-db-credentials
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vulnbank-jwt
                  key: secret
          # FIX: Container security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # FIX: Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # FIX: Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: vulnbank
spec:
  # FIX: ClusterIP instead of LoadBalancer — expose via Ingress
  type: ClusterIP
  selector:
    app: auth-api
  ports:
    - port: 5000
      targetPort: 5000
