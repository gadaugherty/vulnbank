
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: vulnbank
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vulnbank"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-api:
    build: ./auth-api
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: vulnbank
      DB_USER: admin
      DB_PASS: admin123

  payments:
    build: ./payments
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: vulnbank
      DB_USER: admin
      DB_PASS: admin123

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-api
      - payments
