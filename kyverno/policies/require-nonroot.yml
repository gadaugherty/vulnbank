apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must not run as root. Running as root inside a container
      combined with a container escape vulnerability gives host-level access.
      Use runAsNonRoot: true and set a numeric UID.
spec:
  validationFailureAction: Enforce  # Not Audit. Enforce.
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must set securityContext.runAsNonRoot to true"
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
