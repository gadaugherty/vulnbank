name: Security Pipeline

on:
  pull_request:
    branches: [main, main-secure]
  push:
    branches: [main, main-secure, main-insecure]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  secrets:
    name: "🔑 Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          chmod +x gitleaks
      - name: Run Gitleaks
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif -v
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: secret-detection
        continue-on-error: true

  sast-python:
    name: "🐍 SAST — Python"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config p/python --config p/flask \
            --config p/owasp-top-ten --config p/jwt \
            --config .semgrep/custom-rules.yml \
            --sarif --output semgrep-python.sarif \
            auth-api/ || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-python.sarif
          category: sast-python
        continue-on-error: true

  sast-go:
    name: "🔵 SAST — Go"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install and run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd payments && gosec -fmt sarif -out ../gosec-results.sarif -severity medium ./... || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: sast-go
        continue-on-error: true

  sast-js:
    name: "🟡 SAST — JavaScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config p/javascript --config p/react \
            --config p/owasp-top-ten \
            --config .semgrep/custom-rules.yml \
            --sarif --output semgrep-js.sarif \
            frontend/src/ || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-js.sarif
          category: sast-js
        continue-on-error: true

  sca:
    name: "📦 SCA — Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1
          trivy version
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity CRITICAL,HIGH \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format sarif \
            --output trivy-sca.sarif \
            .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca.sarif
          category: sca
        continue-on-error: true
      - name: Generate SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
        continue-on-error: true
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
        continue-on-error: true

  container-scan:
    name: "🐳 Container — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [secrets]
    strategy:
      fail-fast: false
      matrix:
        service: [auth-api, payments, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vulnbank/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1
      - name: Trivy Container Scan
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output trivy-container-${{ matrix.service }}.sarif \
            vulnbank/${{ matrix.service }}:${{ github.sha }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container-${{ matrix.service }}.sarif
          category: container-${{ matrix.service }}
        continue-on-error: true

  iac:
    name: "🏗️ IaC — Terraform"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          download_external_modules: true
          soft_fail: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: iac-terraform
        continue-on-error: true

  k8s-scan:
    name: "☸️ K8s Manifests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'kubernetes/'
          format: 'sarif'
          output: 'trivy-k8s.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-k8s.sarif
          category: k8s-config
        continue-on-error: true

  dockerfile-lint:
    name: "📋 Dockerfile Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint — auth-api
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: auth-api/Dockerfile
          failure-threshold: error
        continue-on-error: true
      - name: Hadolint — payments
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: payments/Dockerfile
          failure-threshold: error
        continue-on-error: true
      - name: Hadolint — frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error
        continue-on-error: true

  security-gate:
    name: "🚦 Security Gate"
    runs-on: ubuntu-latest
    needs: [secrets, sast-python, sast-go, sast-js, sca, container-scan, iac, k8s-scan, dockerfile-lint]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║     VulnBank Security Gate Results       ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          FAILED=0
          WARNINGS=0

          if [ "${{ needs.secrets.result }}" = "failure" ]; then
            echo "❌ BLOCK: Secrets detected"; FAILED=1
          else echo "✅ Secret Detection: passed"; fi

          if [ "${{ needs.sca.result }}" = "failure" ]; then
            echo "❌ BLOCK: Critical/High dependency vulnerability"; FAILED=1
          else echo "✅ Dependency Scan: passed"; fi

          echo ""

          for JOB in sast-python sast-go sast-js container-scan iac k8s-scan dockerfile-lint; do
            RESULT=""
            case $JOB in
              sast-python) RESULT="${{ needs.sast-python.result }}" ;;
              sast-go) RESULT="${{ needs.sast-go.result }}" ;;
              sast-js) RESULT="${{ needs.sast-js.result }}" ;;
              container-scan) RESULT="${{ needs.container-scan.result }}" ;;
              iac) RESULT="${{ needs.iac.result }}" ;;
              k8s-scan) RESULT="${{ needs.k8s-scan.result }}" ;;
              dockerfile-lint) RESULT="${{ needs.dockerfile-lint.result }}" ;;
            esac
            if [ "$RESULT" = "failure" ]; then
              echo "⚠️  $JOB: findings detected (warning)"
              WARNINGS=$((WARNINGS + 1))
            else
              echo "✅ $JOB: passed"
            fi
          done

          echo ""
          echo "════════════════════════════════════════════"
          if [ $FAILED -gt 0 ]; then
            echo "🚫 SECURITY GATE: FAILED — $FAILED hard block(s)"
            exit 1
          elif [ $WARNINGS -gt 0 ]; then
            echo "⚠️  SECURITY GATE: PASSED with $WARNINGS warning(s)"
          else
            echo "✅ SECURITY GATE: ALL CLEAR"
          fi
